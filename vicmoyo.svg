<svg xmlns="http://w3.org" width="400" height="60" viewBox="0 0 400 60">
  <defs>
    <style>
      @import url('https://googleapis.com');
      .name-text {
        font-family: 'Fira Code', monospace;
        font-size: 34px;
        fill: #d27d8c;
        letter-spacing: 0.5px;
      }
    </style>
  </defs>
  
  <!-- Centers the text perfectly within the image canvas -->
  <text x="50%" y="42" dominant-baseline="middle" text-anchor="middle" class="name-text">Victor Moyo</text>
</svg>

